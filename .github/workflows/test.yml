name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite
          tools: composer:v2
          coverage: xdebug
      - run: composer install --working-dir=whmcs_dns --no-interaction --prefer-dist
      - run: composer test-coverage --working-dir=whmcs_dns
      - run: composer analyse --working-dir=whmcs_dns
