name: Build release archive

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Build addon ZIP
        run: whmcs_dns/build-release.sh "$GITHUB_WORKSPACE/dist"

      - name: Upload ZIP to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
