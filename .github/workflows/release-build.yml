name: Build release archive

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cpanel_bridge/go.mod

      - name: Test cPanel bridge
        working-directory: cpanel_bridge
        run: go test ./...

      - name: Verify module version
        run: test "v$(php -r 'echo json_decode(file_get_contents("whmcs_dns/whmcs.json"))->version;')" = "$GITHUB_REF_NAME"

      - name: Build addon ZIP
        run: whmcs_dns/build-release.sh "$GITHUB_WORKSPACE/dist"

      - name: Build cPanel bridge
        run: cpanel_bridge/build-release.sh "$GITHUB_WORKSPACE/dist"

      - name: Upload ZIP to Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
